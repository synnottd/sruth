services:
  caddy:
    image: caddy:2-alpine
    environment:
      ADMIN_ALLOWED_IPS: ${ADMIN_ALLOWED_IPS}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./apps/landing:/srv/landing:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped
    # Caddy also fronts the sibling `bidding` stack (bidding.sruth.live). Both
    # stacks share the external `caddy-net` network so Caddy can DNS-resolve
    # the `bidding` service by name. Create it once on the host with
    # `docker network create caddy-net` (bidding's provision.sh does this).
    networks:
      - default
      - caddy-net

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER}']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_SECRET: ${INTERNAL_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN}
      INGEST_URL_BASE: ${INGEST_URL_BASE}
      INGEST_SRT_URL_BASE: ${INGEST_SRT_URL_BASE}
      ADMIN_EMAILS: ${ADMIN_EMAILS}
      MEDIAMTX_API_URL: http://ingest:9997
      NODE_ENV: production
      PORT: '3000'
      INTERNAL_PORT: '3001'
      HOST: '0.0.0.0'
      WORKER_URL: 'http://worker:4000'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Use 127.0.0.1 (not localhost) — busybox wget resolves localhost to ::1
      # first and gets connection refused because the server binds IPv4 only.
      test: ['CMD', 'wget', '-q', '-O-', 'http://127.0.0.1:3000/health']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # NEXT_PUBLIC_* vars are baked into the client bundle at build time.
        # Setting them under `environment:` below would have no effect.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O-', 'http://127.0.0.1:3002/']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  ingest:
    build:
      context: ./services/ingest
    environment:
      API_HOST: 'api:3001'
      INTERNAL_SECRET: ${INTERNAL_SECRET}
      INGEST_IP_OVERRIDE: 'ingest'
    ports:
      - '1935:1935'
      - '9999:9999/udp'
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://127.0.0.1:9997/v3/paths/list']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL}
      INTERNAL_SECRET: ${INTERNAL_SECRET}
      INGEST_IP_OVERRIDE: 'ingest'
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      ingest:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O-', 'http://127.0.0.1:4000/health']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

# Enable IPv6 on the project network so Caddy sees real client v6 source
# addresses. Without this, IPv6 traffic to published ports goes through
# docker-proxy and arrives looking like it came from the bridge gateway,
# which breaks any IP-based allowlist. Requires "ipv6" + "ip6tables" in
# /etc/docker/daemon.json (set by deploy/provision.sh).
networks:
  default:
    enable_ipv6: true
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/16
        - subnet: fd00:dead:beef::/64
  caddy-net:
    external: true
