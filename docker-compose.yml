services:
  postgres:
    container_name: omega-api-postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER}']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    container_name: omega-api-redis
    image: redis:7-alpine
    ports:
      - '${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  elasticmq:
    container_name: omega-api-elasticmq
    image: softwaremill/elasticmq-native:1.6.9
    ports:
      - '9324:9324'
      - '9325:9325'
    volumes:
      - ./services/worker/elasticmq.conf:/opt/elasticmq.conf
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O- http://localhost:9325 || exit 1']
      interval: 5s
      timeout: 5s
      retries: 5

  ingest:
    build:
      context: ./services/ingest
    environment:
      API_HOST: host.docker.internal:3001
      INTERNAL_SECRET: ${INTERNAL_SECRET}
    ports:
      - '1935:1935'
      - '8080:8080'
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://localhost:8080/health']
      interval: 5s
      timeout: 3s
      retries: 10

  sink:
    image: tiangolo/nginx-rtmp:latest
    ports:
      - '1936:1935'
      - '8081:8080'
    volumes:
      - ./services/worker/test/nginx-sink.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O-', 'http://localhost:8080/health']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
