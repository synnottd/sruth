services:
  postgres:
    container_name: sruth-postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER}']
      interval: 5s
      timeout: 5s
      retries: 5

  ingest:
    build:
      context: ./services/ingest
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      API_HOST: host.docker.internal:3001
      INTERNAL_SECRET: ${INTERNAL_SECRET}
      INGEST_IP_OVERRIDE: ${INGEST_IP_OVERRIDE:-}
    ports:
      - '1935:1935'
      - '9999:9999/udp'
      - '9997:9997'
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://localhost:9997/v3/paths/list']
      interval: 5s
      timeout: 3s
      retries: 10

  sink:
    image: tiangolo/nginx-rtmp:latest
    ports:
      - '1936:1935'
      - '8081:8080'
    volumes:
      - ./services/worker/test/nginx-sink.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O-', 'http://localhost:8080/health']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
