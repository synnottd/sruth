###############################################
# MediaMTX configuration for Sruth ingest
###############################################

# API for health checks
api: yes
apiAddress: :9997

# Logging
logLevel: info
logDestinations: [stdout]

# Disable protocols we don't use
rtsp: no
webrtc: no
hls: no
srt: yes
rtmp: yes

# RTMP server
rtmpAddress: :1935

# SRT server
srtAddress: :9999

# Path defaults — apply to all paths
pathDefaults:
  # On publish: authenticate via API callback
  runOnPublish: /callbacks.sh on-publish "$MTX_PATH"
  runOnPublishRestart: yes

  # On unpublish: log only (worker manages lifecycle)
  runOnUnpublish: echo "[mediamtx] unpublish path=$MTX_PATH"
  runOnUnpublishRestart: yes

  # Logging hooks for visibility
  runOnReady: echo "[mediamtx] ready path=$MTX_PATH source=$MTX_SOURCE_TYPE"
  runOnReadyRestart: yes

  runOnNotReady: echo "[mediamtx] not-ready path=$MTX_PATH"
  runOnNotReadyRestart: yes

paths:
  all:
