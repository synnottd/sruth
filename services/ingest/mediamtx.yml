###############################################
# MediaMTX configuration for Sruth ingest
###############################################

# API for health checks
api: yes
apiAddress: :9997

# Logging
logLevel: info
logDestinations: [stdout]

# Disable protocols we don't use
rtsp: no
webrtc: no
hls: no
srt: yes
rtmp: yes

# RTMP server
rtmpAddress: :1935

# SRT server
srtAddress: :9999

# Path defaults — apply to all paths
pathDefaults:
  # On ready (publisher connected): authenticate via API callback (one-shot, no restart)
  runOnReady: /callbacks.sh on-publish "$MTX_PATH"
  runOnReadyRestart: no

  # On not-ready (publisher disconnected): notify API to stop session
  runOnNotReady: /callbacks.sh on-unpublish "$MTX_PATH"

paths:
  all:
